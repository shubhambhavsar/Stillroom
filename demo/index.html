<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stillroom — Camera studio</title><link rel="stylesheet" href="studio.css">
<header><a class="brand" href="./"><i></i>Stillroom<span>.</span></a><span class="tag">Camera studio</span><span class="demo">Simulated session</span></header>
<main><section class="camera"><div class="camerahead"><label>Shot goal <select id="goal"><option>Portrait</option><option>Profile photo</option><option>Social post</option></select></label><button id="coach" aria-pressed="true">Coach on</button></div>
<div class="stage"><div id="frame"><canvas id="picture" width="900" height="1125" aria-label="Simulated portrait of a subject against a terracotta wall"></canvas><div class="grid" id="grid"></div><span id="ratio"></span><span id="status"></span><canvas id="overlay" aria-hidden="true"></canvas><div id="cue" aria-live="polite"></div></div></div>
<div class="deck"><div class="modes"><button id="photo">Photo</button><button id="video">Video</button></div><button id="shutter" aria-label="Take photo"><b></b></button><button id="gridbtn" aria-pressed="true">▦ Grid</button></div></section>
<aside><p class="eyebrow">FIELD NOTES</p><h1 id="title">Portrait session</h1><div class="line"></div><div class="meta"><span id="part"></span><span id="count"></span></div><h2 id="action"></h2><p id="detail"></p><div id="buttons"></div><div class="progress" id="progress"></div>
<section class="roll"><div class="rollhead"><h3>Session roll</h3><span id="total"></span></div><div id="thumbs"></div></section></aside></main><footer>Stillroom Studio <span>Stage 01 · Interaction prototype</span></footer>
<dialog id="review"><div class="reviewhead"><h2 id="reviewtitle"></h2><button id="close" aria-label="Close review">✕</button></div><img id="result" alt="Clean simulated capture"><p id="caption"></p><div class="reviewactions"><button id="keep">Keep in roll</button><button id="retake">Retake</button><a id="download" download="stillroom-photo.jpg">Download</a></div></dialog>
<script src="guides.js"></script><script src="studio.js"></script></html>
